
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">
  <title>Smart Gallery — Download for Android</title>
  <meta name="description" content="Download Smart Gallery: Photo Cleaner for Android.">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MDKP7RHJZP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-MDKP7RHJZP');

    (function () {
      const storeUrl =
        'https://play.google.com/store/apps/details?id=com.serpilbosnali.smartgallery';

      let redirected = false;

      function redirectToStore() {
        if (redirected) return;
        redirected = true;
        window.location.replace(storeUrl);
      }

      const ua = navigator.userAgent || '';
      const isIOS =
        /iphone|ipad|ipod/i.test(ua) ||
        (navigator.platform === 'MacIntel' &&
         navigator.maxTouchPoints > 1);
      const isAndroid = /android/i.test(ua);

      window.addEventListener('load', function () {
        document.getElementById('manual-link').href = storeUrl;

        gtag('event', 'store_click', {
          store_name: 'google_play',
          link_url: storeUrl,
          device_category: isIOS
            ? 'ios'
            : isAndroid
              ? 'android'
              : 'other',
          redirect_path: '/android',
          event_callback: redirectToStore,
          event_timeout: 1500
        });

        // Analytics yanıt vermezse yönlendirme yine gerçekleşsin.
        setTimeout(redirectToStore, 1800);
      });
    })();
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f8fa;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    p {
      color: #62666d;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #202124;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Smart Gallery</h1>
    <p>Opening Google Play…</p>
    <p>If you are not redirected automatically, continue below.</p>
    <a id="manual-link"
       href="https://play.google.com/store/apps/details?id=com.serpilbosnali.smartgallery">
      Get it on Google Play
    </a>
  </main>
</body>
</html>
